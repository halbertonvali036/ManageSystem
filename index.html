<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050b07" />
    <meta
      name="description"
      content="Create, customize and preview website drafts in one workspace."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>SiteBuilder — Website Builder</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the
      // wrong theme. Dark is the default expression of the neon system; the
      // visitor's stored choice still wins. Kept inline so the preference is
      // honoured even before the React bundle loads.
      (function () {
        try {
          var stored = localStorage.getItem('sms.theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
          document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'light' ? '#f4f7f4' : '#050b07')
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
    <script>
      // Set the document language before first paint so assistive technology
      // and the browser use the right locale from the very first frame.
      (function () {
        try {
          var stored = localStorage.getItem('sms.locale')
          var locale = stored === 'en' || stored === 'az' ? stored : 'az'
          document.documentElement.setAttribute('lang', locale)
        } catch (error) {
          document.documentElement.setAttribute('lang', 'az')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
